<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
                      "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
    <h:head>
        <title>Confirmación</title>
        <h:outputStylesheet library="css" name="estilos.css"/>
    </h:head>
    <h:body>
        <div class="container">
            <h1>Confirmación de operación</h1>
            <div class="alert">
                <p>La parte fue asociada correctamente al carro.</p>
                <ul>
                    <li>Código parte: <strong>#{indexBean.codigoParte}</strong></li>
                    <li>Placa carro: <strong>#{indexBean.placaCarro}</strong></li>
                    <li>Cantidad: <strong>#{indexBean.cantidad}</strong></li>
                </ul>
            </div>
            <h:link outcome="index" value="← Volver al formulario"/>
        </div>
    </h:body>
</html>
